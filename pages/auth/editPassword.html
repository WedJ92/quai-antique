<section class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Changement de mot de passe</h1>
    </div>
</section>

<div class="container p-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <form>
                <div class="mb-3">
                    <label for="CurrentPasswordInput" class="form-label">Mot de passe actuel</label>
                    <input type="password" class="form-control" id="CurrentPasswordInput" name="CurrentPassword" autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label for="PasswordInput" class="form-label">Nouveau mot de passe</label>
                    <input type="password" class="form-control" id="PasswordInput" name="Password" autocomplete="new-password" minlength="8" aria-describedby="PasswordHelp" required>
                    <div id="PasswordHelp" class="form-text">8 caractères minimum.</div>
                </div>
                <div class="mb-3">
                    <label for="ValidatePasswordInput" class="form-label">Confirmez le nouveau mot de passe</label>
                    <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm" autocomplete="new-password" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Changer mon mot de passe</button>
                </div>
            </form>
            <div class="text-center pt-3">
                <a href="/account" onclick="route(event)">Modifier mes informations personnelles</a>
            </div>
        </div>
    </div>
</div>
