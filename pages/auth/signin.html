<div class="container p-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <h1 class="text-center text-primary mb-4">Connexion</h1>
            <form>
                <div class="mb-3">
                    <label for="EmailInput" class="form-label">Email</label>
                    <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.fr" name="Email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="PasswordInput" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="PasswordInput" name="Password" autocomplete="current-password" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Connexion</button>
                </div>
            </form>
            <div class="text-center pt-3">
                <a href="/signup" onclick="route(event)">Vous n'avez pas de compte ? Inscrivez-vous ici !</a>
            </div>
        </div>
    </div>
</div>
