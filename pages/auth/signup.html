<section class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Inscription</h1>
    </div>
</section>

<div class="container p-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <form id="formulaireInscription">
                <div class="mb-3">
    <label for="NomInput" class="form-label">Nom</label>
    <input type="text" class="form-control" id="NomInput" placeholder="Votre nom" name="Nom" autocomplete="family-name" required>
    <div class="invalid-feedback">Le nom est obligatoire.</div>
</div>
<div class="mb-3">
    <label for="PrenomInput" class="form-label">Prénom</label>
    <input type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom" name="Prenom" autocomplete="given-name" required>
    <div class="invalid-feedback">Le prénom est obligatoire.</div>
</div>
                <div class="mb-3">
                    <label for="EmailInput" class="form-label">Email</label>
                    <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.fr" name="Email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="PasswordInput" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="PasswordInput" name="Password" autocomplete="new-password" minlength="8" aria-describedby="PasswordHelp" required>
                    <div id="PasswordHelp" class="form-text">8 caractères minimum.</div>
                </div>
                <div class="mb-3">
                    <label for="ValidatePasswordInput" class="form-label">Confirmez votre mot de passe</label>
                    <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm" autocomplete="new-password" required>
                    <div class="invalid-feedback">Les mots de passe ne correspondent pas.</div>
                </div>
                <div class="text-center">
                    <button type="button" class="btn btn-primary" id="btn-validation-inscription">Inscription</button>    
                </div>
            </form>
            <div class="text-center pt-3">
                <a href="/signin" onclick="route(event)">Vous avez déjà un compte ? Connectez-vous ici !</a>
            </div>
        </div>
    </div>
</div>
