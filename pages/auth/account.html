<section class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Mon compte</h1>
    </div>
</section>

<div class="container p-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <form>
                <div class="mb-3">
                    <label for="NomInput" class="form-label">Nom</label>
                    <input type="text" class="form-control" id="NomInput" placeholder="Votre nom" value="Doe" name="Nom" autocomplete="family-name" required>
                </div>
                <div class="mb-3">
                    <label for="PrenomInput" class="form-label">Prénom</label>
                    <input type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom" value="John" name="Prenom" autocomplete="given-name" required>
                </div>
                <div class="mb-3">
                    <label for="AllergieInput" class="form-label">Allergies (facultatif)</label>
                    <textarea class="form-control" id="AllergieInput" rows="2" placeholder="Fruits de mer, arachides…" name="Allergies" aria-describedby="AllergieHelp">Cacahuètes</textarea>
                    <div id="AllergieHelp" class="form-text">Utilisé uniquement pour adapter vos plats. Vous pouvez effacer cette information à tout moment.</div>
                </div>
                <div class="mb-3">
                    <label for="NbConvivesInput" class="form-label">Nombre de convives habituel</label>
                    <input type="number" class="form-control" id="NbConvivesInput" value="4" min="1" max="10" name="NbConvives" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Modifier mes informations</button>
                </div>
            </form>

            <div class="text-center pt-3">
                <a href="/editPassword" onclick="route(event)">Modifier mon mot de passe</a>
            </div>

            <hr class="my-4">

            <div class="text-center">
                <button type="button" class="btn btn-outline-danger">Supprimer mon compte</button>
            </div>
        </div>
    </div>
</div>
