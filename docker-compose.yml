# Lance tout le projet Quai Antique (depuis le dossier quai-antique) :
#   docker compose up -d --build
services:

  # ---------- Front : ton site ----------
  front:
    build: .
    ports:
      - "3000:80"          # http://localhost:3000
    depends_on:
      - api

  # ---------- API Symfony fournie par Studi ----------
  api:
    build: ../quai-antique-api
    ports:
      - "8000:80"          # http://127.0.0.1:8000/api/doc
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      # 127.0.0.1 devient "db" : le nom du service MySQL ci-dessous
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=8.0&charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy

  # ---------- Base de données MySQL ----------
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql   # les données survivent aux redémarrages
    # Pas de "ports" : la base n'est accessible qu'aux autres conteneurs
    # (et ça évite le conflit avec ton MySQL80 sur le port 3306)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      retries: 20

  # ---------- phpMyAdmin : voir la base dans le navigateur ----------
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"          # http://localhost:8081
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
